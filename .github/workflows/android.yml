name: Build APK

# Builds Decaf Home's .apk, runs the unit tests, and attaches the APK to the run
# (and to a release for v* tags).
#
# Signing: add three repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE      the .jks file, base64-encoded
#   ANDROID_KEY_ALIAS     decafhome
#   ANDROID_KEY_PASSWORD  the keystore password
# Keep the same key forever: Android only installs an update over the app if it's
# signed with the same key. Without the secrets the run makes a one-off test key,
# and that APK can't be updated in place later (uninstall first).
#
# Add [screenshots] to a commit message (or run the workflow by hand) to also boot
# an Android 15 emulator and save screenshots of the launcher.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take emulator screenshots
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret, so this APK is signed with a one-off test key."
            ALIAS=decafhome
            PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASSWORD" -keypass "$PASSWORD" -dname "CN=Decaf Home test build"
            echo "SIGNED_WITH=test" >> "$GITHUB_ENV"
          fi
          {
            echo "storeFile=$PWD/release.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$PASSWORD"
          } > keystore.properties

      - name: Download Gradle (with retries)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Built $SRC"
          case "$SRC" in *unsigned*) echo "::error::APK came out unsigned"; exit 1;; esac
          SUFFIX=""; [ "$SIGNED_WITH" = test ] && SUFFIX="_test-key"
          OUT="Decaf-Home_${VERSION}${SUFFIX}.apk"
          mkdir -p out && cp "$SRC" "out/$OUT"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "out/$OUT" | head -3
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=out/$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: Decaf-Home-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Attach to a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Decaf Home $TAG" \
              --notes "Download the .apk on your Android phone and open it. Allow installs from your browser or Files app when Android asks, then tap Install. Then open Decaf Home → Settings → Choose home app."
          fi
          gh release upload "$TAG" "$APK" --clobber

  screenshots:
    name: Emulator screenshots
    if: contains(github.event.head_commit.message, '[screenshots]') || (github.event_name == 'workflow_dispatch' && inputs.screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Download Gradle (with retries)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Build a debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/screenshots.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
